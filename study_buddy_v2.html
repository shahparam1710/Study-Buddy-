<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC;--surface:#fff;--surface2:#F1F5F9;--text:#0F172A;--dim:#475569;--muted:#94A3B8;
  --border:#E2E8F0;--accent:#6366F1;--accent2:#4F46E5;--accentSoft:rgba(99,102,241,.12);
  --danger:#DC2626;--warning:#D97706;--success:#059669;--shadow:0 10px 30px rgba(15,23,42,.06)
}
html[data-theme=dark]{--bg:#0B1120;--surface:#111827;--surface2:#1E293B;--text:#F8FAFC;--dim:#CBD5E1;--muted:#64748B;--border:#263449;--shadow:0 12px 32px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}
.sidebar{border-right:1px solid var(--border);background:var(--surface);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{font-size:20px;font-weight:800;padding:0 10px 28px;letter-spacing:-.5px}.logo span{color:var(--accent)}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--dim);padding:11px 12px;border-radius:10px;text-align:left;font-weight:600;display:flex;gap:11px;align-items:center}.nav button:hover{background:var(--surface2);color:var(--text)}.nav button.active{background:var(--accentSoft);color:var(--accent2)}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:14px}.main{min-width:0;padding:34px 42px 70px;max-width:1250px;width:100%;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}.eyebrow{font-size:13px;color:var(--muted);font-weight:700}.title{font-size:30px;line-height:1.15;margin:5px 0;font-weight:800;letter-spacing:-.8px}.subtitle{color:var(--dim);font-size:14px}
.icon-btn{width:38px;height:38px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:9px;font-weight:700}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel,.task-card,.subject-card,.session,.empty{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-label{font-size:12px;color:var(--muted);font-weight:700}.stat-value{font-size:28px;font-weight:800;margin-top:7px}.stat-note{font-size:12px;color:var(--dim);margin-top:3px}
.panel{padding:20px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel-title{font-weight:800;font-size:16px}.panel-sub{font-size:12px;color:var(--muted)}
.focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.focus{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface2)}.focus h3{font-size:14px;margin:9px 0 7px}.focus p{font-size:12px;color:var(--dim);margin:0 0 12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:99px;padding:5px 8px;background:var(--surface2);color:var(--dim)}.badge.overdue{color:var(--danger);background:rgba(220,38,38,.09)}.badge.soon{color:var(--warning);background:rgba(217,119,6,.10)}.badge.done{color:var(--success);background:rgba(5,150,105,.10)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--dim)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.field textarea{min-height:80px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.task-list{display:grid;gap:10px}.task-card{padding:15px;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start}.check{width:21px;height:21px;margin-top:2px;accent-color:var(--accent)}.task-title{font-weight:750;font-size:14px}.task-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.progress-row{display:flex;gap:10px;align-items:center;margin-top:10px}.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}.progress>i{display:block;height:100%;background:var(--accent);border-radius:inherit}.progress-row input{width:125px}.task-actions{display:flex;gap:5px}.task-actions button{border:0;background:transparent;color:var(--muted);padding:5px}.task-actions button:hover{color:var(--text)}
.schedule-days{display:grid;gap:16px}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.day-name{font-weight:800}.capacity{font-size:12px;color:var(--dim)}.capacity.over{color:var(--danger)}.session{padding:14px;display:grid;grid-template-columns:6px 1fr auto;gap:13px;align-items:center;margin-bottom:8px}.session-bar{height:100%;border-radius:99px;background:var(--accent)}.session-title{font-weight:750;font-size:14px}.session-meta{font-size:12px;color:var(--dim);margin-top:5px}.why{margin-top:9px;font-size:12px;color:var(--dim);line-height:1.55}
.calendar-nav{display:flex;gap:6px;align-items:center}.day-chip{border:1px solid var(--border);background:var(--surface);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700}.day-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.kpi{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.kpi:last-child{border-bottom:0}.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.subject-card{padding:16px}.subject-top{display:flex;justify-content:space-between;align-items:center}.subject-name{font-weight:800}.subject-stat{font-size:12px;color:var(--dim);margin-top:9px}
.availability{display:grid;gap:8px}.avail-row{display:grid;grid-template-columns:80px 1fr 110px 110px;gap:8px;align-items:center}.avail-row label{font-size:13px;font-weight:700}.avail-row input[type=checkbox]{accent-color:var(--accent)}
.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-back.show{display:flex}.modal{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.timer{font-size:62px;font-weight:800;text-align:center;letter-spacing:-2px;margin:28px 0}.timer-controls{display:flex;justify-content:center;gap:8px}.feedback{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.feedback button{padding:11px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;font-weight:700}.hidden{display:none!important}.mobile-nav{display:none}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--surface);padding:11px 14px;border-radius:10px;font-size:12px;font-weight:700;z-index:100}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.focus-grid,.subject-grid{grid-template-columns:1fr}.main{padding:26px 22px 90px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none}.main{padding:24px 15px 90px}.title{font-size:25px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.task-card{grid-template-columns:auto 1fr}.task-actions{grid-column:2}.avail-row{grid-template-columns:65px 1fr 1fr}.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:40}.mobile-nav button{border:0;background:transparent;color:var(--dim);padding:10px 4px;font-size:10px;font-weight:700}.mobile-nav button.active{color:var(--accent)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Study <span>Buddy</span></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-bottom"><button class="nav" style="width:100%" id="settingsNav"></button></div>
</aside>
<main class="main" id="app"></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal-back" id="modalBack"></div>
<script>
const KEY='studybuddy_v2';
const COLORS=['#6366F1','#3B82F6','#10B981','#F59E0B','#EF4444','#EC4899','#8B5CF6'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const NAV=[
 {id:'dashboard',label:'Dashboard',icon:'⌂'},{id:'tasks',label:'Tasks',icon:'☰'},
 {id:'schedule',label:'Schedule',icon:'▤'},{id:'subjects',label:'Subjects',icon:'◫'},
 {id:'progress',label:'Progress',icon:'◔'}
];
let state={
 subjects:[],tasks:[],sessions:[],prefs:{name:'',dailyMinutes:90,theme:'system',accent:'indigo'},
 availability:{Mon:[{start:'16:00',end:'21:00'}],Tue:[{start:'16:00',end:'21:00'}],Wed:[{start:'16:00',end:'21:00'}],Thu:[{start:'16:00',end:'21:00'}],Fri:[{start:'16:00',end:'21:00'}],Sat:[{start:'10:00',end:'18:00'}],Sun:[{start:'10:00',end:'18:00'}]},
 nextId:1,onboarded:false
};
let page='dashboard', editingId=null, activeSession=null, timerInterval=null;

function id(){return String(state.nextId++)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dateKey(d=new Date()){let x=new Date(d);x.setHours(0,0,0,0);return x.toISOString().slice(0,10)}
function parseDate(s){return new Date(s+'T12:00:00')}
function daysUntil(s){return Math.ceil((parseDate(s)-parseDate(dateKey()))/86400000)}
function fmtDate(s){return parseDate(s).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
function subject(t){return state.subjects.find(s=>s.id===t.subjectId)}
function remaining(t){return Math.max(0,Math.round(t.estMinutes*(1-(t.progress||0)/100)))}
function pending(){return state.tasks.filter(t=>!t.done && remaining(t)>0)}
function dueBadge(t){
 const d=daysUntil(t.due);
 if(t.done)return '<span class="badge done">Completed</span>';
 if(d<0)return '<span class="badge overdue">'+Math.abs(d)+'d overdue</span>';
 if(d===0)return '<span class="badge soon">Due today</span>';
 if(d<=3)return '<span class="badge soon">Due in '+d+'d</span>';
 return '<span class="badge">'+fmtDate(t.due)+'</span>';
}
function priority(t){
 const d=daysUntil(t.due), r=remaining(t);
 const urgency=d<0?260:d===0?190:d<=2?145:d<=7?90:Math.max(20,55-d*2);
 const difficulty=(t.difficulty||3)*16;
 const pressure=Math.min(100,r/10);
 const type=t.type==='test'?18:t.type==='project'?8:0;
 return urgency+difficulty+pressure+type;
}
function sorted(){return [...pending()].sort((a,b)=>priority(b)-priority(a))}
function effectiveTheme(){
 if(state.prefs.theme==='system')return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
 return state.prefs.theme;
}
function applyTheme(){document.documentElement.dataset.theme=effectiveTheme()}
function toast(msg){let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function todaySessions(){return state.sessions.filter(s=>s.date===dateKey()&&s.status==='planned').sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function sessionTask(s){return state.tasks.find(t=>t.id===s.taskId)}
function timeMin(x){let [h,m]=x.split(':').map(Number);return h*60+m}
function minTime(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}

function migrate(){
 try{
  const raw=localStorage.getItem(KEY)||localStorage.getItem('studybuddy_v1');
  if(raw) state={...state,...JSON.parse(raw),prefs:{...state.prefs,...(JSON.parse(raw).prefs||{})}};
 }catch(e){}
 state.subjects=state.subjects||[];state.tasks=state.tasks||[];state.sessions=state.sessions||[];
 state.availability=state.availability||{};
 DAYS.forEach(d=>{if(!state.availability[d])state.availability[d]=[{start:d==='Sat'||d==='Sun'?'10:00':'16:00',end:d==='Sat'||d==='Sun'?'18:00':'21:00'}]});
 state.tasks.forEach(t=>{t.difficulty=Math.min(5,Math.max(1,Number(t.difficulty)||3));t.progress=Number(t.progress)||0;t.estMinutes=Number(t.estMinutes)||60});
 save();applyTheme();
}

function nav(){
 document.getElementById('sideNav').innerHTML=NAV.map(n=>`<button class="${page===n.id?'active':''}" onclick="go('${n.id}')"><span>${n.icon}</span>${n.label}</button>`).join('');
 document.getElementById('settingsNav').innerHTML=`<button class="${page==='settings'?'active':''}" onclick="go('settings')"><span>⚙</span>Settings</button>`;
 document.getElementById('mobileNav').innerHTML=NAV.map(n=>`<button class="${page===n.id?'active':''}" onclick="go('${n.id}')">${n.icon}<br>${n.label}</button>`).join('');
}
function go(p){page=p;render()}

function header(title,sub,actions=''){
 return `<div class="topbar"><div><div class="eyebrow">Study Buddy</div><div class="title">${title}</div><div class="subtitle">${sub}</div></div><div class="actions">${actions}</div></div>`;
}

function dashboard(){
 const p=pending(), overdue=p.filter(t=>daysUntil(t.due)<0), week=p.filter(t=>daysUntil(t.due)>=0&&daysUntil(t.due)<=7);
 const today=todaySessions(), completed=state.tasks.filter(t=>t.done).length;
 const total=state.tasks.length, pct=total?Math.round(completed/total*100):0;
 const next=sorted()[0];
 return header(`Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}${state.prefs.name?', '+esc(state.prefs.name):''}.`,
 'Your plan updates around deadlines, workload, progress and your available study time.',
 `<button class="btn primary" onclick="openTask()">+ Add task</button>`)
 +`<section class="grid stats">
 <div class="stat"><div class="stat-label">PENDING</div><div class="stat-value">${p.length}</div><div class="stat-note">${overdue.length} overdue</div></div>
 <div class="stat"><div class="stat-label">DUE THIS WEEK</div><div class="stat-value">${week.length}</div><div class="stat-note">Across all subjects</div></div>
 <div class="stat"><div class="stat-label">TODAY</div><div class="stat-value">${today.reduce((a,s)=>a+s.minutes,0)}m</div><div class="stat-note">planned study</div></div>
 <div class="stat"><div class="stat-label">COMPLETION</div><div class="stat-value">${pct}%</div><div class="stat-note">${completed}/${total} tasks</div></div>
 </section>
 <section class="panel"><div class="panel-head"><div><div class="panel-title">Today's Plan</div><div class="panel-sub">${today.length?today.length+' sessions scheduled':'No sessions scheduled yet'}</div></div><button class="btn small" onclick="go('schedule')">Open schedule →</button></div>
 ${today.length?`<div class="task-list">${today.slice(0,4).map(sessionCard).join('')}</div>`:`<div class="empty" style="padding:20px;box-shadow:none"><b>${next?'Your next priority is '+esc(next.title):'Add your first task'}</b><div class="panel-sub" style="margin-top:6px">Your planner will build study blocks around your workload.</div><button class="btn primary small" style="margin-top:12px" onclick="${next?'regenerate()':'openTask()'}">${next?'Build today’s plan':'Add task'}</button></div>`}
 </section>
 <section class="panel"><div class="panel-head"><div><div class="panel-title">Priority workload</div><div class="panel-sub">What needs attention next</div></div><button class="btn small" onclick="go('tasks')">View all →</button></div>
 ${sorted().slice(0,3).map(focusCard).join('')||'<div class="panel-sub">Nothing urgent. Nice.</div>'}</section>`;
}
function focusCard(t){
 const s=subject(t),d=daysUntil(t.due);
 return `<div class="focus" style="margin-bottom:8px"><span class="dot" style="background:${s?.color||'var(--accent)'}"></span>
 <h3>${esc(t.title)}</h3><p>${esc(s?.name||'No subject')} · ${remaining(t)} min left · difficulty ${t.difficulty}/5</p>${dueBadge(t)}</div>`;
}

function taskForm(){
 const t=editingId&&state.tasks.find(x=>x.id===editingId);
 return `<section class="panel" id="taskForm"><div class="panel-head"><div><div class="panel-title">${t?'Edit task':'Add a task'}</div><div class="panel-sub">The planner uses this information to build realistic study blocks.</div></div></div>
 <div class="form-grid">
 <div class="field"><label>Subject</label><select id="fSubject">${state.subjects.map(s=>`<option value="${s.id}" ${t?.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Task type</label><select id="fType">${['assignment','test','project'].map(x=>`<option ${t?.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field full"><label>Task title</label><input id="fTitle" value="${esc(t?.title||'')}" placeholder="e.g. Biology Unit 4 SAC preparation"></div>
 <div class="field"><label>Due date</label><input id="fDue" type="date" value="${t?.due||dateKey()}"></div>
 <div class="field"><label>Estimated total study time (minutes)</label><input id="fMin" type="number" min="15" step="5" value="${t?.estMinutes||60}"></div>
 <div class="field"><label>Difficulty (1–5)</label><select id="fDiff">${[1,2,3,4,5].map(x=>`<option ${Number(t?.difficulty||3)===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>Current progress</label><input id="fProg" type="number" min="0" max="100" step="5" value="${t?.progress||0}"></div>
 <div class="field full"><label>Notes (optional)</label><textarea id="fNotes" placeholder="What does this task involve?">${esc(t?.notes||'')}</textarea></div>
 </div><div class="form-actions"><button class="btn" onclick="closeForm()">Cancel</button><button class="btn primary" onclick="saveTask()">${t?'Save changes':'Add task'}</button></div></section>`;
}
function tasks(){
 const all=state.tasks, over=all.filter(t=>!t.done&&daysUntil(t.due)<0).sort((a,b)=>priority(b)-priority(a));
 const up=all.filter(t=>!t.done&&daysUntil(t.due)>=0).sort((a,b)=>priority(b)-priority(a));
 const done=all.filter(t=>t.done);
 return header('Tasks','Every task feeds into the planner. Change a deadline or estimate and regenerate the plan.',
 `<button class="btn" onclick="regenerate()">↻ Recalculate</button><button class="btn primary" onclick="openTask()">+ Add task</button>`)
 + (editingId?taskForm():'') +
 `<section class="panel"><div class="panel-head"><div><div class="panel-title">Active tasks</div><div class="panel-sub">${all.length} total · difficulty is 1–5</div></div></div>
 ${over.length?`<h4 style="margin:12px 0 8px;color:var(--danger)">Overdue</h4>${over.map(taskCard).join('')}`:''}
 ${up.length?`<h4 style="margin:18px 0 8px">Upcoming</h4>${up.map(taskCard).join('')}`:''}
 ${!over.length&&!up.length?'<div class="panel-sub">No active tasks.</div>':''}</section>
 ${done.length?`<section class="panel"><div class="panel-head"><div class="panel-title">Completed</div></div>${done.map(taskCard).join('')}</section>`:''}`;
}
function taskCard(t){
 const s=subject(t),pct=Math.min(100,t.progress||0);
 return `<div class="task-card"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">
 <div><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span class="badge"><span class="dot" style="background:${s?.color||'var(--accent)'}"></span>${esc(s?.name||'No subject')}</span><span class="badge">${t.type}</span><span class="badge">${t.difficulty}/5 difficulty</span><span class="badge">${remaining(t)}m left</span>${dueBadge(t)}</div>
 <div class="progress-row"><div class="progress"><i style="width:${pct}%"></i></div><input type="range" min="0" max="100" step="5" value="${pct}" onchange="setProgress('${t.id}',this.value)"><span style="font-size:11px;width:35px">${pct}%</span></div></div>
 <div class="task-actions"><button title="Edit" onclick="editTask('${t.id}')">✎</button><button title="Delete" onclick="deleteTask('${t.id}')">×</button></div></div>`;
}

function sessionCard(s){
 const t=sessionTask(s);if(!t)return '';
 const sub=subject(t), when=s.start?`${s.start} · `:'';
 return `<div class="session"><div class="session-bar" style="background:${sub?.color||'var(--accent)'}"></div><div><div class="session-title">${esc(t.title)}</div><div class="session-meta">${esc(sub?.name||'No subject')} · ${when}${s.minutes} min ${s.status==='completed'?'· completed':''}</div></div>${s.status==='planned'?`<button class="btn primary small" onclick="startSession('${s.id}')">Start</button>`:'<span class="badge done">Done</span>'}</div>`;
}
function schedule(){
 const dates=[];for(let i=0;i<10;i++){let d=new Date();d.setDate(d.getDate()+i);dates.push(dateKey(d))}
 return header('Schedule','A global plan that balances deadlines, remaining work, difficulty, daily capacity and availability.',
 `<button class="btn" onclick="regenerate()">↻ Recalculate</button>`)
 +`<section class="panel"><div class="panel-head"><div><div class="panel-title">Next 10 days</div><div class="panel-sub">Daily budget: ${state.prefs.dailyMinutes} min</div></div></div><div class="schedule-days">${dates.map(dayBlock).join('')}</div></section>`;
}
function dayBlock(d){
 const ss=state.sessions.filter(s=>s.date===d&&s.status==='planned').sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
 const done=state.sessions.filter(s=>s.date===d&&s.status==='completed').reduce((a,s)=>a+s.actualMinutes||s.minutes,0);
 const mins=ss.reduce((a,s)=>a+s.minutes,0), dt=parseDate(d), label=d===dateKey()?'Today':dt.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
 const day=DAYS[(dt.getDay()+6)%7];
 return `<div><div class="day-head"><div class="day-name">${label}</div><div class="capacity ${mins>state.prefs.dailyMinutes?'over':''}">${mins}/${state.prefs.dailyMinutes} min planned${done?` · ${done}m completed`:''}</div></div>
 ${ss.length?ss.map(sessionCard).join(''):`<div style="font-size:12px;color:var(--muted);padding:8px 2px">No planned sessions${d===dateKey()?' — you’re free today.':''}</div>`}</div>`;
}

function progressPage(){
 const done=state.tasks.filter(t=>t.done).length,total=state.tasks.length,pct=total?Math.round(done/total*100):0;
 const completedMin=state.sessions.filter(s=>s.status==='completed').reduce((a,s)=>a+(s.actualMinutes||s.minutes),0);
 const plannedMin=state.sessions.filter(s=>s.status==='planned').reduce((a,s)=>a+s.minutes,0);
 const subs=state.subjects.map(s=>{let ts=state.tasks.filter(t=>t.subjectId===s.id),avg=ts.length?Math.round(ts.reduce((a,t)=>a+(t.progress||0),0)/ts.length):0;return {s,ts,avg}}).filter(x=>x.ts.length);
 return header('Progress','See actual study completed alongside task progress.','')+
 `<section class="grid stats"><div class="stat"><div class="stat-label">TASK COMPLETION</div><div class="stat-value">${pct}%</div><div class="stat-note">${done}/${total} tasks</div></div><div class="stat"><div class="stat-label">STUDY COMPLETED</div><div class="stat-value">${completedMin}m</div><div class="stat-note">from finished sessions</div></div><div class="stat"><div class="stat-label">STUDY PLANNED</div><div class="stat-value">${plannedMin}m</div><div class="stat-note">upcoming sessions</div></div><div class="stat"><div class="stat-label">SESSIONS</div><div class="stat-value">${state.sessions.filter(s=>s.status==='completed').length}</div><div class="stat-note">completed</div></div></section>
 <section class="panel"><div class="panel-head"><div class="panel-title">Subject progress</div></div>${subs.length?subs.map(x=>`<div class="kpi"><div style="min-width:150px"><b>${esc(x.s.name)}</b><div class="panel-sub">${x.ts.filter(t=>t.done).length}/${x.ts.length} tasks complete</div></div><div style="flex:1;max-width:500px;margin-left:20px"><div class="bar"><i style="width:${x.avg}%"></i></div></div><b>${x.avg}%</b></div>`).join(''):'<div class="panel-sub">Add tasks to see subject progress.</div>'}</section>`;
}

function subjectsPage(){
 return header('Subjects','Keep your workload organised by subject.',`<button class="btn primary" onclick="addSubject()">+ Add subject</button>`)
 +`<section class="panel"><div class="subject-grid">${state.subjects.map(s=>{let ts=state.tasks.filter(t=>t.subjectId===s.id),p=ts.filter(t=>t.done).length;return `<div class="subject-card"><div class="subject-top"><div><span class="dot" style="background:${s.color};margin-right:7px"></span><span class="subject-name">${esc(s.name)}</span></div><button class="btn small danger" onclick="deleteSubject('${s.id}')">Delete</button></div><div class="subject-stat">${p}/${ts.length} tasks complete</div></div>`}).join('')||'<div class="panel-sub">No subjects yet. Add one before creating tasks.</div>'}</div></section>`;
}

function settings(){
 return header('Settings','Your daily capacity and availability shape the planner.','')+
 `<section class="panel"><div class="panel-head"><div class="panel-title">Profile & study capacity</div></div><div class="form-grid">
 <div class="field"><label>Name</label><input id="sName" value="${esc(state.prefs.name)}" placeholder="Your name"></div>
 <div class="field"><label>Daily study limit (minutes)</label><input id="sMinutes" type="number" min="15" max="720" step="5" value="${state.prefs.dailyMinutes}"></div>
 <div class="field"><label>Theme</label><select id="sTheme"><option value="system" ${state.prefs.theme==='system'?'selected':''}>System</option><option value="light" ${state.prefs.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.prefs.theme==='dark'?'selected':''}>Dark</option></select></div>
 <div class="field"><label>Accent</label><select id="sAccent">${Object.keys({indigo:1,blue:1,green:1,orange:1}).map(x=>`<option ${state.prefs.accent===x?'selected':''}>${x}</option>`).join('')}</select></div>
 </div><div class="form-actions"><button class="btn primary" onclick="saveSettings()">Save settings</button></div></section>
 <section class="panel"><div class="panel-head"><div><div class="panel-title">Weekly availability</div><div class="panel-sub">The planner will only place new sessions inside these windows.</div></div></div>
 <div class="availability">${DAYS.map(d=>{let a=state.availability[d]?.[0]||{start:'16:00',end:'21:00'};return `<div class="avail-row"><label>${d}</label><input type="checkbox" id="a${d}" ${state.availability[d]?.length?'checked':''}><input type="time" id="start${d}" value="${a.start}"><input type="time" id="end${d}" value="${a.end}"></div>`}).join('')}</div>
 <div class="form-actions"><button class="btn primary" onclick="saveAvailability()">Save availability & recalculate</button></div></section>`;
}

function render(){
 nav();let content=page==='dashboard'?dashboard():page==='tasks'?tasks():page==='schedule'?schedule():page==='subjects'?subjectsPage():page==='progress'?progressPage():settings();
 document.getElementById('app').innerHTML=content;
 if(!state.onboarded&&(!state.subjects.length||!state.prefs.name))setTimeout(onboarding,50);
}

function openTask(){editingId=null;if(!state.subjects.length){toast('Add a subject first');go('subjects');return}page='tasks';editingId='new';render();setTimeout(()=>document.getElementById('taskForm')?.scrollIntoView({behavior:'smooth'}),30)}
function closeForm(){editingId=null;render()}
function editTask(tid){editingId=tid;page='tasks';render();setTimeout(()=>document.getElementById('taskForm')?.scrollIntoView({behavior:'smooth'}),30)}
function saveTask(){
 const title=document.getElementById('fTitle').value.trim(),due=document.getElementById('fDue').value,min=Number(document.getElementById('fMin').value),prog=Math.min(100,Math.max(0,Number(document.getElementById('fProg').value)||0));
 if(!title||!due||!min){toast('Fill in the title, due date and time');return}
 if(editingId&&editingId!=='new'){
  let t=state.tasks.find(x=>x.id===editingId);Object.assign(t,{title,subjectId:document.getElementById('fSubject').value,type:document.getElementById('fType').value,due,estMinutes:min,difficulty:Number(document.getElementById('fDiff').value),progress:prog,done:prog>=100});
 }else state.tasks.push({id:id(),title,subjectId:document.getElementById('fSubject').value,type:document.getElementById('fType').value,due,estMinutes:min,difficulty:Number(document.getElementById('fDiff').value),progress:prog,done:prog>=100,notes:document.getElementById('fNotes').value.trim(),createdAt:Date.now()});
 editingId=null;save();regenerate(false);toast('Task saved and plan updated');page='tasks';render();
}
function toggleTask(tid){let t=state.tasks.find(x=>x.id===tid);t.done=!t.done;t.progress=t.done?100:Math.min(95,t.progress||0);save();regenerate(false);render()}
function setProgress(tid,v){let t=state.tasks.find(x=>x.id===tid);t.progress=Number(v);t.done=t.progress>=100;save();regenerate(false);render()}
function deleteTask(tid){if(!confirm('Delete this task?'))return;state.tasks=state.tasks.filter(t=>t.id!==tid);state.sessions=state.sessions.filter(s=>s.taskId!==tid);save();render()}
function addSubject(){let n=prompt('Subject name');if(!n?.trim())return;state.subjects.push({id:id(),name:n.trim(),color:COLORS[state.subjects.length%COLORS.length]});save();render()}
function deleteSubject(sid){if(state.tasks.some(t=>t.subjectId===sid)&&!confirm('This will also delete its tasks. Continue?'))return;state.tasks=state.tasks.filter(t=>t.subjectId!==sid);state.subjects=state.subjects.filter(s=>s.id!==sid);state.sessions=state.sessions.filter(s=>state.tasks.some(t=>t.id===s.taskId));save();render()}

function saveSettings(){
 state.prefs.name=document.getElementById('sName').value.trim();state.prefs.dailyMinutes=Math.max(15,Number(document.getElementById('sMinutes').value)||90);state.prefs.theme=document.getElementById('sTheme').value;state.prefs.accent=document.getElementById('sAccent').value;
 const map={indigo:'#6366F1',blue:'#3B82F6',green:'#10B981',orange:'#F59E0B'};document.documentElement.style.setProperty('--accent',map[state.prefs.accent]);document.documentElement.style.setProperty('--accent2',map[state.prefs.accent]);save();applyTheme();regenerate(false);toast('Settings saved');render()
}
function saveAvailability(){
 DAYS.forEach(d=>{let on=document.getElementById('a'+d).checked;state.availability[d]=on?[{start:document.getElementById('start'+d).value,end:document.getElementById('end'+d).value}]:[]});
 save();regenerate(false);toast('Availability saved and plan recalculated');render()
}

function regenerate(show=true){
 // Keep completed history; remove only future planned sessions, then rebuild globally.
 state.sessions=state.sessions.filter(s=>s.status==='completed');
 const tasks=sorted();
 const today=new Date();today.setHours(0,0,0,0);
 const maxDue=tasks.length?Math.max(...tasks.map(t=>parseDate(t.due).getTime())):today.getTime();
 const horizon=Math.max(14,Math.ceil((maxDue-today.getTime())/86400000)+1);
 const capacities={};
 for(let i=0;i<horizon;i++){
  let d=new Date(today);d.setDate(today.getDate()+i);let key=dateKey(d),day=DAYS[(d.getDay()+6)%7],avail=state.availability[day]||[];
  let raw=avail.reduce((sum,w)=>sum+Math.max(0,timeMin(w.end)-timeMin(w.start)),0);
  capacities[key]=Math.min(state.prefs.dailyMinutes,raw);
 }
 const remainingMap=new Map(tasks.map(t=>[t.id,remaining(t)]));
 // Global greedy scheduler: repeatedly allocate to the most time-critical task while reserving future capacity.
 for(let safety=0;safety<5000;safety++){
  let active=tasks.filter(t=>(remainingMap.get(t.id)||0)>0);
  if(!active.length)break;
  let chosen=active.sort((a,b)=>{
   const da=daysUntil(a.due),db=daysUntil(b.due);
   const ra=remainingMap.get(a.id),rb=remainingMap.get(b.id);
   return (priority(b)+rb/Math.max(1,db+2))-(priority(a)+ra/Math.max(1,da+2));
  })[0];
  let candidates=[];
  for(let i=0;i<horizon;i++){
   let d=new Date(today);d.setDate(today.getDate()+i);let key=dateKey(d);
   if(key>chosen.due && daysUntil(chosen.due)>=0)continue;
   if((capacities[key]||0)>=15)candidates.push({key,cap:capacities[key],i});
  }
  if(!candidates.length)break;
  // Prefer earlier dates for urgent tasks, but avoid dumping all work today.
  const d=daysUntil(chosen.due);
  let target=candidates.sort((a,b)=>{
   const loadA=state.sessions.filter(s=>s.date===a.key&&s.status==='planned').reduce((x,s)=>x+s.minutes,0);
   const loadB=state.sessions.filter(s=>s.date===b.key&&s.status==='planned').reduce((x,s)=>x+s.minutes,0);
   const scoreA=(d<=2? -a.i : a.i*.7)+loadA/50;
   const scoreB=(d<=2? -b.i : b.i*.7)+loadB/50;
   return scoreA-scoreB;
  })[0];
  let amount=Math.min(remainingMap.get(chosen.id),target.cap,chosen.difficulty>=4?45:50);
  amount=Math.max(15,Math.floor(amount/5)*5);
  if(amount>target.cap)amount=Math.floor(target.cap/5)*5;
  if(amount<15){capacities[target.key]=0;continue}
  const existing=state.sessions.filter(s=>s.date===target.key&&s.status==='planned').reduce((x,s)=>x+s.minutes,0);
  let start='16:00',day=DAYS[(parseDate(target.key).getDay()+6)%7],window=(state.availability[day]||[])[0];
  if(window){
   let cursor=timeMin(window.start);
   const ses=state.sessions.filter(s=>s.date===target.key&&s.status==='planned').sort((a,b)=>timeMin(a.start)-timeMin(b.start));
   ses.forEach(s=>cursor=Math.max(cursor,timeMin(s.start)+s.minutes+10));
   if(cursor+amount>timeMin(window.end)) {capacities[target.key]=0;continue}
   start=minTime(cursor);
  }
  state.sessions.push({id:id(),taskId:chosen.id,date:target.key,start,minutes:amount,status:'planned',createdAt:Date.now()});
  remainingMap.set(chosen.id,remainingMap.get(chosen.id)-amount);
  capacities[target.key]-=amount;
 }
 save();if(show){toast('Plan recalculated');render()}
}

function startSession(sid){
 const s=state.sessions.find(x=>x.id===sid);if(!s)return;
 activeSession={...s,elapsed:0,running:true};clearInterval(timerInterval);
 document.getElementById('modalBack').innerHTML=`<div class="modal"><div class="panel-sub">STUDY SESSION</div><h2 style="margin:6px 0">${esc(sessionTask(s).title)}</h2><div class="panel-sub">${esc(subject(sessionTask(s))?.name||'')} · ${s.minutes} minutes planned</div><div class="timer" id="timerDisplay">${fmtTimer(s.minutes*60)}</div><div class="timer-controls"><button class="btn" onclick="pauseTimer()" id="pauseBtn">Pause</button><button class="btn primary" onclick="finishSession()">Finish</button></div><div id="feedbackArea" class="hidden"></div></div>`;
 document.getElementById('modalBack').classList.add('show');runTimer();
}
function runTimer(){timerInterval=setInterval(()=>{if(!activeSession?.running)return;activeSession.elapsed++;let left=Math.max(0,activeSession.minutes*60-activeSession.elapsed);let e=document.getElementById('timerDisplay');if(e)e.textContent=fmtTimer(left);if(left<=0)finishSession()},1000)}
function fmtTimer(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function pauseTimer(){if(!activeSession)return;activeSession.running=!activeSession.running;document.getElementById('pauseBtn').textContent=activeSession.running?'Pause':'Resume'}
function finishSession(){
 if(!activeSession)return;clearInterval(timerInterval);activeSession.running=false;
 const area=document.getElementById('feedbackArea');area.classList.remove('hidden');area.innerHTML=`<div style="margin-top:18px;font-weight:800">How did that session feel?</div><div class="feedback"><button onclick="completeSession('easy')">Too easy</button><button onclick="completeSession('right')">About right</button><button onclick="completeSession('hard')">Difficult</button><button onclick="completeSession('unfinished')">Didn't finish</button></div>`;
 document.querySelector('.timer-controls').classList.add('hidden');
}
function completeSession(feedback){
 const s=state.sessions.find(x=>x.id===activeSession.id),t=sessionTask(s),actual=Math.max(1,Math.round(activeSession.elapsed/60));
 s.status='completed';s.actualMinutes=actual;s.feedback=feedback;s.completedAt=Date.now();
 if(feedback==='easy')t.progress=Math.min(100,(t.progress||0)+Math.min(20,Math.round(actual/Math.max(1,t.estMinutes)*25)));
 else if(feedback==='right')t.progress=Math.min(100,(t.progress||0)+Math.min(15,Math.round(actual/Math.max(1,t.estMinutes)*20)));
 else if(feedback==='hard')t.progress=Math.min(100,(t.progress||0)+Math.min(10,Math.round(actual/Math.max(1,t.estMinutes)*15)));
 if(t.progress>=100)t.done=true;
 activeSession=null;document.getElementById('modalBack').classList.remove('show');save();regenerate(false);toast('Session logged. Your plan has been updated.');render();
}

function onboarding(){
 const back=document.getElementById('modalBack');
 back.innerHTML=`<div class="modal"><div class="eyebrow">WELCOME TO STUDY BUDDY</div><h2 style="margin:6px 0">Build a plan that fits your real week.</h2><p class="subtitle">Start with a name, your daily study limit and at least one subject. You can change everything later.</p>
 <div class="form-grid"><div class="field full"><label>Name</label><input id="oName" placeholder="What should Study Buddy call you?"></div><div class="field full"><label>Daily study limit (minutes)</label><input id="oMin" type="number" value="90" min="15" step="5"></div><div class="field full"><label>First subject</label><input id="oSub" placeholder="e.g. Biology"></div></div>
 <div class="form-actions"><button class="btn" onclick="skipOnboard()">Skip</button><button class="btn primary" onclick="finishOnboard()">Get started</button></div></div>`;
 back.classList.add('show');
}
function skipOnboard(){state.onboarded=true;save();document.getElementById('modalBack').classList.remove('show')}
function finishOnboard(){
 const n=document.getElementById('oName').value.trim(),m=Number(document.getElementById('oMin').value)||90,s=document.getElementById('oSub').value.trim();
 state.prefs.name=n;state.prefs.dailyMinutes=Math.max(15,m);if(s)state.subjects.push({id:id(),name:s,color:COLORS[0]});state.onboarded=true;save();document.getElementById('modalBack').classList.remove('show');render();
}

function init(){migrate();const map={indigo:'#6366F1',blue:'#3B82F6',green:'#10B981',orange:'#F59E0B'};document.documentElement.style.setProperty('--accent',map[state.prefs.accent]||map.indigo);document.documentElement.style.setProperty('--accent2',map[state.prefs.accent]||map.indigo);render();window.addEventListener('storage',render)}
init();
</script>
</body>
